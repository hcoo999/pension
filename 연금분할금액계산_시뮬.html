<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연금수령액 계산 </title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --input-border: #ff4d4d;
            --net-income-color: #ff6600;
            --primary-color: #2c3e50;
        }
        * { -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
            color: #333;
        }
        h1, h2, h3 {
            color: var(--primary-color);
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .section {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: #fdfdfd;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            border-left: 5px solid var(--primary-color);
            padding-left: 10px;
        }
        .flex-row {
            display: flex;
            flex-wrap: nowrap;
            gap: 10px;
            align-items: center;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            min-width: 80px;
            flex: 1;
        }
        .form-group.wide { flex: 3; min-width: 180px; }
        .form-group.narrow { flex: 1; min-width: 70px; }
        
        label {
            font-size: 0.85rem;
            margin-bottom: 5px;
            font-weight: bold;
            white-space: nowrap;
        }
        input, select {
            padding: 8px;
            border: 2px solid var(--input-border);
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
            text-align: right;
        }
        select { text-align-last: center; }
        
        .target-table-wrapper { overflow: auto; margin-top: 10px; max-width: 100%; }
        .target-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0;
        }
        .target-table th, .target-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        .target-table th { background-color: #f2f2f2; font-size: 0.85rem;}
        .target-table input { width: 90%; text-align: right; border: 1px solid var(--input-border);}

        /* 구분행(헤더) 및 첫 열 고정(frozen) */
        .target-table thead th {
            position: sticky;
            top: 0;
            z-index: 3;
        }
        .target-table th:first-child,
        .target-table td:first-child {
            position: sticky;
            left: 0;
            z-index: 2;
            background-color: #fdfdfd;
            white-space: nowrap;
            box-shadow: 2px 0 4px rgba(0,0,0,0.08);
        }
        .target-table thead th:first-child {
            z-index: 4;
            background-color: #f2f2f2;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .btn {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
        }
        .btn-primary { background-color: #27ae60; }
        .btn-excel { background-color: #2980b9; }
        .btn-print { background-color: #7f8c8d; }
        .btn:hover { opacity: 0.9; }

        .summary-box {
            display: flex;
            justify-content: space-around;
            background: #eef2f7;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .summary-item span { color: #c0392b; }

        .chart-container {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .chart-box {
            flex: 1;
            min-width: 450px;
            height: 300px;
            background: #fff;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .table-wrapper { overflow-x: auto; }
        .scroll-hint { display: none; font-size: 0.75rem; color: #888; text-align: right; margin-bottom: 4px; }
        @media (max-width: 768px) { .scroll-hint { display: block; } }
        .result-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .result-table th, .result-table td {
            border: 1px solid #aaa;
            padding: 6px 4px;
        }
        .result-table th {
            background-color: #ebedef;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        /* 첫 행(헤더) 및 첫 열(연령) 고정(frozen) */
        .result-table th:first-child,
        .result-table td:first-child {
            position: sticky;
            left: 0;
            z-index: 1;
            background-color: #fff;
            box-shadow: 2px 0 4px rgba(0,0,0,0.08);
        }
        .result-table th:first-child {
            z-index: 3;
            background-color: #ebedef;
        }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .net-amount { color: var(--net-income-color); font-weight: bold; }

        @media (max-width: 768px) {
            body { margin: 0; }
            .container {
                max-width: 100%;
                padding: 14px;
                border-radius: 0;
                box-shadow: none;
            }
            h1 { font-size: 1.3rem; margin-bottom: 16px; }
            h2 { font-size: 1.1rem; }
            .section { padding: 12px; margin-bottom: 16px; }
            .section-title { font-size: 1rem; }

            /* 입력 영역: 가로 스크롤 대신 세로로 쌓기 */
            .flex-row {
                flex-wrap: wrap;
                overflow-x: visible;
            }
            .form-group {
                flex: 1 1 calc(50% - 10px);
                min-width: 0;
            }
            .form-group.wide,
            .flex-row > .form-group:first-child {
                flex: 1 1 100% !important;
            }
            .form-group.narrow {
                flex: 1 1 calc(33.333% - 8px);
                min-width: 0;
            }

            label { font-size: 0.75rem; white-space: normal; }
            input, select { padding: 8px 4px; font-size: 15px; }

            /* 구간별 희망연금 표: 가로 스크롤 허용 */
            .target-table { white-space: nowrap; }
            .target-table th, .target-table td { padding: 6px; font-size: 0.8rem; }
            .target-table input { width: 80px; }

            /* 버튼 영역: 세로로 쌓고 터치하기 쉽게 */
            .btn-container {
                flex-direction: column;
                gap: 10px;
                margin: 16px 0;
            }
            .btn {
                width: 100%;
                padding: 14px;
                box-sizing: border-box;
            }

            /* 요약 박스: 세로로 쌓기 */
            .summary-box {
                flex-direction: column;
                gap: 10px;
                text-align: center;
                font-size: 0.95rem;
            }

            /* 차트: 세로로 쌓고 높이 축소 */
            .chart-container { flex-direction: column; gap: 14px; }
            .chart-box { min-width: 0; width: 100%; height: 240px; padding: 8px; }

            /* 결과 표: 가로 스크롤, 폰트 축소, 스크롤 유도 */
            .table-wrapper {
                -webkit-overflow-scrolling: touch;
            }
            .result-table { font-size: 0.75rem; }
            .result-table th, .result-table td { padding: 5px 4px; }
        }

        @media (max-width: 420px) {
            .form-group { flex: 1 1 100%; }
            .form-group.narrow { flex: 1 1 calc(33.333% - 8px); }
        }

        @media print {
            body { background: white; margin: 0; padding: 10px; font-size: 11px; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            .btn-container, .chart-container { display: none !important; }
            input, select { border: none; background: transparent; appearance: none; }
            .section { margin-bottom: 10px; padding: 10px; }
            .result-table th, .result-table td { padding: 4px 2px; font-size: 10px; }
            @page { size: A4 landscape; margin: 1cm; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>연금수령액 계산</h1>
    
    <div class="section">
        <div class="section-title">1. 계좌 및 기본 정보 설정</div>
        <div class="flex-row" style="margin-bottom: 15px;">
            <div class="form-group" style="flex: 1.5; min-width: 120px;">
                <label>계좌구분</label>
                <select id="accountType" onchange="toggleAccountFields()">
                    <option value="일반">일반계좌</option>
                    <option value="퇴직IRP">퇴직IRP</option>
                    <option value="연금저축">연금저축</option>
                </select>
            </div>
            <div class="form-group narrow">
                <label>현재 나이</label>
                <input type="number" id="currentAge" value="54">
            </div>
            <div class="form-group narrow">
                <label>연금개시연령</label>
                <input type="number" id="startAge" value="55">
            </div>
            <div class="form-group narrow">
                <label>수령기간 (년)</label>
                <input type="number" id="duration" value="30">
            </div>
            <div class="form-group narrow">
                <label>수령방법</label>
                <select id="payFrequency">
                    <option value="매월">매월</option>
                    <option value="매분기">매분기</option>
                    <option value="매년" selected>매년</option>
                </select>
            </div>
            <div class="form-group narrow">
                <label>물가상승률 (%)</label>
                <input type="number" id="inflationRate" step="0.1" value="2.0">
            </div>
            <div class="form-group narrow">
                <label>운용이율 (%)</label>
                <input type="number" id="investmentRate" step="0.1" value="4.0">
            </div>
        </div>

        <div class="flex-row" id="dynamicInputRow">
            </div>
    </div>

    <div class="section">
        <div class="section-title">2. 나이별 희망 연금액 지정</div>
        <p style="font-size:0.8rem; color:#666; margin-top:-10px;">* 해당 연령대부터 다음 연령 전까지 적용. (입력 단위: 만원)</p>
        <div class="target-table-wrapper">
        <table class="target-table">
            <thead>
                <tr>
                    <th>구분</th>
                    <th>구간 1</th>
                    <th>구간 2</th>
                    <th>구간 3</th>
                    <th>구간 4</th>
                    <th>구간 5</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><strong>개시연령(세)</strong></td>
                    <td><input type="number" id="targetAge1" value="55"></td>
                    <td><input type="number" id="targetAge2" value="65"></td>
                    <td><input type="number" id="targetAge3" value="75"></td>
                    <td><input type="number" id="targetAge4" value=""></td>
                    <td><input type="number" id="targetAge5" value=""></td>
                </tr>
                <tr>
                    <td><strong>연금액(만원)</strong></td>
                    <td><input type="text" inputmode="numeric" pattern="[0-9,]*" id="targetAmt1" value="2,000" oninput="formatInputMoney(this)"></td>
                    <td><input type="text" inputmode="numeric" pattern="[0-9,]*" id="targetAmt2" value="1,500" oninput="formatInputMoney(this)"></td>
                    <td><input type="text" inputmode="numeric" pattern="[0-9,]*" id="targetAmt3" value="1,000" oninput="formatInputMoney(this)"></td>
                    <td><input type="text" inputmode="numeric" pattern="[0-9,]*" id="targetAmt4" value="" oninput="formatInputMoney(this)"></td>
                    <td><input type="text" inputmode="numeric" pattern="[0-9,]*" id="targetAmt5" value="" oninput="formatInputMoney(this)"></td>
                </tr>
            </tbody>
        </table>
        </div>
    </div>

    <div class="btn-container">
        <button class="btn btn-primary" onclick="runSimulation()">시뮬레이션 실행</button>
    </div>

    <div id="resultSection" style="display: none;">
        <h2 id="resultTitle">예상연금 수령액</h2>
        
        <div class="summary-box">
            <div class="summary-item">자산 고갈 나이: <span id="summaryAge">-</span></div>
            <div class="summary-item">총 수령액(세후): <span id="summaryTotal">-</span></div>
            <div class="summary-item">최종 잔액 (110세/고갈시): <span id="summaryFinal">-</span></div>
        </div>

        <div class="chart-container">
            <div class="chart-box"><canvas id="assetChart"></canvas></div>
            <div class="chart-box"><canvas id="pensionChart"></canvas></div>
        </div>

        <div class="scroll-hint">← 좌우로 스크롤하여 전체 표 확인 →</div>
        <div class="table-wrapper">
            <table class="result-table" id="simulationTable">
                <thead id="tableHeader"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="btn-container">
            <button class="btn btn-excel" onclick="exportToExcel()">Excel 저장 및 열기</button>
            <button class="btn btn-print" onclick="window.print()">보고서 인쇄</button>
        </div>
    </div>
</div>

<script>
    let assetChartObj = null;
    let pensionChartObj = null;
    let computedData = [];

    window.onload = function() {
        toggleAccountFields();
    };

    function formatInputMoney(obj) {
        let num = obj.value.replace(/[^0-9]/g, '');
        obj.value = num ? Number(num).toLocaleString() : '';
    }

    function parseMoney(val) {
        if(!val) return 0;
        // 쉼표 등 숫자가 아닌 문자 전면 청소 후 파싱 수행
        let clearVal = val.toString().replace(/,/g, '').trim();
        return parseFloat(clearVal) || 0;
    }

    function formatMoney(num) {
        return Math.round(num).toLocaleString();
    }

    function toggleAccountFields() {
        const type = document.getElementById('accountType').value;
        const row = document.getElementById('dynamicInputRow');
        let html = '';

        if (type === '일반') {
            html = `
                <div class="form-group wide">
                    <label>현재평가액 (만원)</label>
                    <input type="text" inputmode="numeric" pattern="[0-9,]*" id="initAsset" value="50,000" oninput="formatInputMoney(this)">
                </div>
            `;
        } else if (type === '퇴직IRP') {
            html = `
                <div class="form-group wide">
                    <label>퇴직원금 (만원)</label>
                    <input type="text" inputmode="numeric" pattern="[0-9,]*" id="irpPrincipal" value="30,000" oninput="formatInputMoney(this)">
                </div>
                <div class="form-group wide">
                    <label>운용수익 (만원)</label>
                    <input type="text" inputmode="numeric" pattern="[0-9,]*" id="irpGain" value="10,000" oninput="formatInputMoney(this)">
                </div>
                <div class="form-group wide">
                    <label>퇴직소득세율 (%)</label>
                    <input type="number" id="irpTaxRate" step="0.1" value="8.5">
                </div>
            `;
        } else if (type === '연금저축') {
            html = `
                <div class="form-group wide">
                    <label>세액공제 받은 원금 (만원)</label>
                    <input type="text" inputmode="numeric" pattern="[0-9,]*" id="taxDedAmt" value="3,000" oninput="formatInputMoney(this)">
                </div>
                <div class="form-group wide">
                    <label>세액공제 안받은 원금 (만원)</label>
                    <input type="text" inputmode="numeric" pattern="[0-9,]*" id="noTaxDedAmt" value="2,000" oninput="formatInputMoney(this)">
                </div>
                <div class="form-group wide">
                    <label>운용수익 (만원)</label>
                    <input type="text" inputmode="numeric" pattern="[0-9,]*" id="savingGain" value="1,000" oninput="formatInputMoney(this)">
                </div>
            `;
        }
        row.innerHTML = html;
    }

    function getTargetPensionMap() {
        let map = {};
        for(let i=1; i<=5; i++) {
            let ageInput = document.getElementById(`targetAge${i}`).value;
            let amtInput = document.getElementById(`targetAmt${i}`).value;
            
            let age = parseInt(ageInput);
            let amt = parseMoney(amtInput);
            if(!isNaN(age) && amt > 0) {
                map[age] = amt;
            }
        }
        return map;
    }

    function runSimulation() {
        try {
            const accountType = document.getElementById('accountType').value;
            const currentAge = parseInt(document.getElementById('currentAge').value) || 0;
            const startAge = parseInt(document.getElementById('startAge').value) || 0;
            const duration = parseInt(document.getElementById('duration').value) || 0;
            const payFreq = document.getElementById('payFrequency').value;
            const inflationRate = (parseFloat(document.getElementById('inflationRate').value) || 0) / 100;
            const investmentRate = (parseFloat(document.getElementById('investmentRate').value) || 0) / 100;
            const currentYear = new Date().getFullYear();

            let freqFactor = 1;
            if (payFreq === '매월') freqFactor = 12;
            if (payFreq === '매분기') freqFactor = 4;

            const targetMap = getTargetPensionMap();
            let lastTargetAmt = 0; 

            let totalAsset = 0;
            let irpP = 0, irpG = 0, irpTaxRate = 0;
            let saDed = 0, saNoDed = 0, saGain = 0;

            if(accountType === '일반') {
                totalAsset = parseMoney(document.getElementById('initAsset').value);
            } else if(accountType === '퇴직IRP') {
                irpP = parseMoney(document.getElementById('irpPrincipal').value);
                irpG = parseMoney(document.getElementById('irpGain').value);
                irpTaxRate = (parseFloat(document.getElementById('irpTaxRate').value) || 0) / 100;
                totalAsset = irpP + irpG;
            } else if(accountType === '연금저축') {
                saDed = parseMoney(document.getElementById('taxDedAmt').value);
                saNoDed = parseMoney(document.getElementById('noTaxDedAmt').value);
                saGain = parseMoney(document.getElementById('savingGain').value);
                totalAsset = saDed + saNoDed + saGain;
            }

            computedData = [];
            let accumulatedTotalReceipt = 0;
            let isDepleted = false;
            let depletionAge = '110세 이상 또는 미고갈';

            for (let age = currentAge; age <= 110; age++) {
                let year = currentYear + (age - currentAge);
                let beforeAsset = totalAsset;

                if (age > currentAge && totalAsset > 0) {
                    beforeAsset = totalAsset * (1 + investmentRate);
                    
                    if(accountType === '퇴직IRP') {
                        let ratioP = totalAsset > 0 ? irpP / totalAsset : 0;
                        irpP = beforeAsset * ratioP;
                        irpG = beforeAsset * (1 - ratioP);
                    } else if(accountType === '연금저축') {
                        let totalPool = saDed + saNoDed + saGain;
                        let rDed = totalPool > 0 ? saDed / totalPool : 0;
                        let rNoDed = totalPool > 0 ? saNoDed / totalPool : 0;
                        saDed = beforeAsset * rDed;
                        saNoDed = beforeAsset * rNoDed;
                        saGain = beforeAsset * (1 - rDed - rNoDed);
                    }
                }

                if (age >= startAge && beforeAsset <= 0) {
                    if(!isDepleted) {
                        depletionAge = `${age - 1}세 고갈`;
                        isDepleted = true;
                    }
                    break; 
                }

                let preTaxPension = 0;      
                let preTaxAnnual = 0;       
                let tax = 0;                
                let note = "-";              

                if (age >= startAge && age < startAge + duration) {
                    if (targetMap[age] !== undefined) {
                        lastTargetAmt = targetMap[age];
                    }
                    
                    preTaxPension = lastTargetAmt;
                    preTaxAnnual = preTaxPension * freqFactor;

                    if (preTaxAnnual > beforeAsset) {
                        preTaxAnnual = beforeAsset;
                        preTaxPension = preTaxAnnual / freqFactor;
                    }

                    if (accountType === '퇴직IRP') {
                        let remainToExtract = preTaxAnnual;
                        let taxSum = 0;
                        let principalExtracted = 0;
                        let gainExtracted = 0;
                        let pensionYear = age - startAge + 1;
                        let appliedTaxRate = irpTaxRate * (pensionYear <= 10 ? 0.7 : 0.6);

                        if (irpP > 0) {
                            if (irpP >= remainToExtract) {
                                principalExtracted = remainToExtract;
                                irpP -= remainToExtract;
                                remainToExtract = 0;
                            } else {
                                principalExtracted = irpP;
                                remainToExtract -= irpP;
                                irpP = 0;
                            }
                            taxSum += principalExtracted * appliedTaxRate;
                        }

                        if (remainToExtract > 0) {
                            if (irpG >= remainToExtract) {
                                gainExtracted = remainToExtract;
                                irpG -= remainToExtract;
                            } else {
                                gainExtracted = irpG;
                                irpG = 0;
                            }
                            if (gainExtracted > 1500) {
                                taxSum += gainExtracted * 0.154;
                            } else {
                                let yieldTaxRate = age >= 80 ? 0.033 : (age >= 70 ? 0.044 : 0.055);
                                taxSum += gainExtracted * yieldTaxRate;
                            }
                        }

                        tax = taxSum;
                        if (principalExtracted > 0 && gainExtracted === 0) note = "퇴직원금";
                        else if (principalExtracted === 0 && gainExtracted > 0) note = "운용수익";
                        else if (principalExtracted > 0 && gainExtracted > 0) note = "원금/수익 혼합";
                    } 
                    else if (accountType === '연금저축') {
                        let remainToExtract = preTaxAnnual;
                        let taxSum = 0;
                        let typeNote = "";

                        if (saNoDed > 0 && remainToExtract > 0) {
                            typeNote = "안세공";
                            if (saNoDed >= remainToExtract) {
                                saNoDed -= remainToExtract;
                                remainToExtract = 0;
                            } else {
                                remainToExtract -= saNoDed;
                                saNoDed = 0;
                            }
                        }

                        if (remainToExtract > 0) {
                            typeNote = (typeNote === "안세공") ? "혼합" : "원금수익";
                            let taxableAmt = remainToExtract;
                            if (saDed + saGain >= taxableAmt) {
                                if(saDed >= taxableAmt) {
                                    saDed -= taxableAmt;
                                } else {
                                    let lack = taxableAmt - saDed;
                                    saDed = 0;
                                    saGain -= lack;
                                }
                            } else {
                                taxableAmt = saDed + saGain;
                                saDed = 0;
                                saGain = 0;
                            }

                            if (taxableAmt > 1500) {
                                taxSum += taxableAmt * 0.154;
                            } else {
                                let yieldTaxRate = age >= 80 ? 0.033 : (age >= 70 ? 0.044 : 0.055);
                                taxSum += taxableAmt * yieldTaxRate;
                            }
                            remainToExtract -= taxableAmt;
                        }
                        tax = taxSum;
                        note = typeNote;
                    }
                }

                let postTaxAnnual = preTaxAnnual - tax;
                let afterAsset = beforeAsset - preTaxAnnual; 
                totalAsset = afterAsset; 
                
                let withdrawalRate = beforeAsset > 0 ? (preTaxAnnual / beforeAsset) * 100 : 0;
                if (age >= startAge) accumulatedTotalReceipt += postTaxAnnual;

                computedData.push({
                    age: age,
                    year: year,
                    preTaxPension: preTaxPension,
                    postTaxPension: freqFactor > 0 ? (postTaxAnnual / freqFactor) : postTaxAnnual, 
                    tax: tax,
                    preTaxAnnual: preTaxAnnual,
                    postTaxAnnual: postTaxAnnual,
                    beforeAsset: beforeAsset,
                    afterAsset: afterAsset,
                    withdrawalRate: withdrawalRate,
                    note: note
                });

                if(age === 110 && afterAsset <= 0 && !isDepleted) {
                    depletionAge = "110세 고갈";
                }
            }

            document.getElementById('resultSection').style.display = 'block';
            document.getElementById('resultTitle').innerText = `예상연금 수령액 (${payFreq} 수령)`;
            
            document.getElementById('summaryAge').innerText = depletionAge;
            document.getElementById('summaryTotal').innerText = formatMoney(accumulatedTotalReceipt) + " 만원";
            let finalRow = computedData[computedData.length - 1];
            document.getElementById('summaryFinal').innerText = finalRow ? formatMoney(finalRow.afterAsset) + " 만원" : "0 만원";

            renderTable(accountType);
            renderCharts();
            
        } catch (e) {
            alert("시뮬레이션 중 오류가 발생했습니다: " + e.message);
        }
    }

    function renderTable(accountType) {
        const header = document.getElementById('tableHeader');
        const body = document.getElementById('tableBody');
        
        header.innerHTML = `
            <tr>
                <th>연령</th>
                <th>년도</th>
                <th>세전연금<br>(만원)</th>
                <th>세후연금<br>(만원)</th>
                <th>세금<br>(만원/년)</th>
                <th>세전연간수령액<br>(만원)</th>
                <th>전적립금<br>(만원)</th>
                <th>후적립금<br>(만원)</th>
                <th>인출률</th>
                <th>비고</th>
            </tr>
        `;

        let html = "";
        computedData.forEach(row => {
            html += `
                <tr>
                    <td class="text-center">${row.age}세</td>
                    <td class="text-center">${row.year}년</td>
                    <td class="text-right">${formatMoney(row.preTaxPension)}</td>
                    <td class="text-right net-amount">${formatMoney(row.postTaxPension)}</td>
                    <td class="text-right">${formatMoney(row.tax)}</td>
                    <td class="text-right">${formatMoney(row.preTaxAnnual)}</td>
                    <td class="text-right" style="font-weight:bold;">${formatMoney(row.beforeAsset)}</td>
                    <td class="text-right" style="font-weight:bold;">${formatMoney(row.afterAsset)}</td>
                    <td class="text-center">${row.withdrawalRate.toFixed(2)}%</td>
                    <td class="text-center">${row.note}</td>
                </tr>
            `;
        });
        body.innerHTML = html;
    }

    function renderCharts() {
        const labels = computedData.map(d => `${d.age}세`);
        const assetData = computedData.map(d => Math.round(d.afterAsset));
        const pensionData = computedData.map(d => Math.round(d.postTaxAnnual));

        if(assetChartObj) assetChartObj.destroy();
        if(pensionChartObj) pensionChartObj.destroy();

        const canvasAsset = document.getElementById('assetChart');
        const canvasPension = document.getElementById('pensionChart');

        if(!canvasAsset || !canvasPension) return;

        const ctxAsset = canvasAsset.getContext('2d');
        assetChartObj = new Chart(ctxAsset, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '후적립금 추이 (만원)',
                    data: assetData,
                    borderColor: '#2980b9',
                    backgroundColor: 'rgba(41, 128, 185, 0.1)',
                    fill: true,
                    tension: 0.1
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        const ctxPension = canvasPension.getContext('2d');
        pensionChartObj = new Chart(ctxPension, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: '세후 연간 수령액 (만원)',
                    data: pensionData,
                    borderColor: '#e67e22',
                    backgroundColor: 'rgba(230, 126, 34, 0.7)',
                    tension: 0.1
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function exportToExcel() {
        if(computedData.length === 0) {
            alert("시뮬레이션을 먼저 실행해 주세요.");
            return;
        }

        const accountType = document.getElementById('accountType').value;
        const excelRows = [
            ["연령", "년도", "세전연금(만원)", "세후연금(만원)", "세금(만원/년)", "세전연간수령액(만원)", "전적립금(만원)", "후적립금(만원)", "인출률", "비고"]
        ];

        computedData.forEach(row => {
            excelRows.push([
                row.age + "세",
                row.year + "년",
                Math.round(row.preTaxPension),
                Math.round(row.postTaxPension),
                Math.round(row.tax),
                Math.round(row.preTaxAnnual),
                Math.round(row.beforeAsset),
                Math.round(row.afterAsset),
                row.withdrawalRate.toFixed(2) + "%",
                row.note
            ]);
        });

        const worksheet = XLSX.utils.aoa_to_sheet(excelRows);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "연금수령예상표");
        XLSX.writeFile(workbook, `pension_simulation_${accountType}.xlsx`);
    }
</script>
